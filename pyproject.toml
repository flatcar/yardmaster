[project]
name = "yardmaster"
version = "0.1.0"
description = "Flatcar Container Linux Release Management Tool"
authors = [
    {name = "Flatcar Team", email = "flatcar-linux-user@googlegroups.com"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["flatcar", "release", "automation", "linux", "containers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Operating System",
]

dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-jenkins>=1.8.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "sphinx>=7.0.0",
    "sphinx-autobuild>=2024.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "types-tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/flatcar/yardmaster"
Documentation = "https://github.com/flatcar/yardmaster/docs"
Repository = "https://github.com/flatcar/yardmaster"
Issues = "https://github.com/flatcar/yardmaster/issues"

[project.scripts]
yardmaster = "yardmaster.cli:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yardmaster*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
